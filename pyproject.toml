[project]
name = "pitching-analyzer"
version = "0.1.0"
description = "Pitching mechanics video analyzer calibrated against the Driveline OpenBiomechanics dataset"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "mediapipe==1.2.3",
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "imageio-ffmpeg>=0.5",
    "anthropic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:mediapipe.*"]
